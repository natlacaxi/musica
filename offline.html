<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0614">
<meta name="color-scheme" content="dark">
<title>Hors ligne</title>
<link rel="icon" href="favicon-32.png">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{display:flex;align-items:center;justify-content:center;padding:max(1.4rem,env(safe-area-inset-top)) 1.2rem max(1.4rem,env(safe-area-inset-bottom));background:radial-gradient(ellipse at 25% 60%,#1a0828 0%,#0d0614 45%,#080808 100%);color:#f1f5f9;font-family:'DM Sans',-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  .card{width:100%;max-width:360px;padding:2rem 1.6rem;text-align:center;border-radius:28px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);box-shadow:0 24px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%)}
  img{width:72px;height:72px;border-radius:22px;margin-bottom:1rem;box-shadow:0 10px 34px rgba(255,45,85,.4)}
  h1{font-size:1.4rem;margin-bottom:.4rem}
  p{font-size:.9rem;color:rgba(241,245,249,.6);line-height:1.6;margin-bottom:1.4rem}
  button{width:100%;padding:.85rem 1rem;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:1rem;color:#fff;cursor:pointer;background:linear-gradient(135deg,#a78bfa,#f472b6);touch-action:manipulation}
  button:active{transform:scale(.96)}
</style>
</head>
<body>
  <main class="card">
    <img src="icon-192.png" alt="" width="72" height="72">
    <h1>Vous êtes hors ligne</h1>
    <p>Impossible de charger la page pour le moment. Vérifiez votre connexion, puis réessayez.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
